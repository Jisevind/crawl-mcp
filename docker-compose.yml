---

services:
  crawl4ai-mcp:
    build: .
    image: crawl4ai-mcp:latest
    container_name: crawl4ai-mcp-stdio
    restart: "no"

    # STDIO mode is for MCP clients that own stdin/stdout.
    stdin_open: true
    tty: false

    environment:
      - FASTMCP_LOG_LEVEL=${FASTMCP_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # Headless browser optimization
      - CRAWL4AI_BROWSER_TYPE=${CRAWL4AI_BROWSER_TYPE:-chromium}
      - CRAWL4AI_HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      # Chrome-specific flags for Docker
      - CHROME_FLAGS=--no-sandbox --disable-dev-shm-usage --disable-gpu --headless

    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache

    command: ["python", "-u", "-m", "crawl4ai_mcp.server"]

    profiles:
      - stdio

    healthcheck:
      disable: true

  # Alternative configuration for HTTP mode
  crawl4ai-mcp-http:
    build: .
    image: crawl4ai-mcp:latest
    container_name: crawl4ai-mcp-http
    restart: unless-stopped
    
    environment:
      - FASTMCP_LOG_LEVEL=${FASTMCP_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # Headless browser optimization
      - CRAWL4AI_BROWSER_TYPE=${CRAWL4AI_BROWSER_TYPE:-chromium}
      - CRAWL4AI_HEADLESS=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      # Chrome-specific flags for Docker
      - CHROME_FLAGS=--no-sandbox --disable-dev-shm-usage --disable-gpu --headless
    
    ports:
      - "8001:8000"
    
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    
    command: ["python", "-u", "-m", "crawl4ai_mcp.server", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    
    #profiles:
    #  - http
    
    healthcheck:
      # This checks if the port 8000 is actually listening for connections
      test: ["CMD-SHELL", "timeout 1s bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Give it a full minute to warm up the browsers
